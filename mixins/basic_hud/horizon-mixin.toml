[mod]
id = "basic_hud"
version = "0.5.0"
priority = 100

# Counting totems and writing above a player's head hook the game's own
# functions, which have no hook point, so it builds on this commit only.
[compatibility]
horizon_revision = "68ac6f647e7022b2c696e81863d7cface28c9416"

[[module]]
id = "recent_pickups"
file = "crates/horizon-client/src/game.rs"
name = "basic_hud_recent_pickups"
source = "recent_pickups.rs"

[[module]]
id = "pickup_data"
file = "crates/horizon-client/src/game.rs"
name = "basic_hud_pickup_data"
source = "pickup_data.rs"

[[injection]]
id = "pickup_before"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_pickup_refused"
helper = "pickup_before.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
]

[[injection]]
id = "pickup_local"
kind = "HEAD"
target = "horizon_client::game::pickups::Game<'_>::add_pickup"
helper = "pickup_local.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "taken", ty = "&crate::game::pickups::Taken", value = "&taken" },
  { name = "collector", ty = "crate::game::pickups::Collector", value = "collector" },
]

[[module]]
id = "pickup_packets"
file = "crates/horizon-client/src/net.rs"
name = "basic_hud_pickup_packets"
